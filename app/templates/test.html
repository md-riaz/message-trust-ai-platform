<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Model</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f3f4f6; display: flex; justify-content: center; min-height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin-top: 40px; height: fit-content; }
    h2 { margin-top: 0; color: #111827; }
    form { display: flex; flex-direction: column; gap: 15px; }
    textarea { padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; resize: vertical; min-height: 120px; font-family: inherit; font-size: 1rem; width: 100%; }
    button { padding: 12px; border: none; border-radius: 8px; background: #10b981; color: white; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    button:hover { background: #059669; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    pre { background: #1f2937; color: #e5e7eb; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 0.9rem; display: none; }
    .nav { margin-top: 20px; text-align: center; }
    .nav a { color: #4b5563; text-decoration: none; font-weight: 500; }
    .nav a:hover { text-decoration: underline; color: #111827; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Test Classifier</h2>
    <form id="predictForm">
      <textarea name="text" placeholder="Paste SMS message here..." required></textarea>
      <button type="submit" id="submitBtn">Check Message</button>
    </form>
    <pre id="result"></pre>
    <div class="nav">
      <a href="train">Go to Training &rarr;</a><br><br>
      <a href="/">&larr; Back to Home</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("predictForm");
    const result = document.getElementById("result");
    const btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Checking...";
      result.style.display = "none";
      
      try {
        const formData = new FormData(form);
        const res = await fetch("predict", { method: "POST", body: formData });
        const data = await res.json();
        
        result.textContent = JSON.stringify(data, null, 2);
        result.style.display = "block";
      } catch (err) {
        result.textContent = "Error: Could not connect to server.";
        result.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Check Message";
      }
    });
  </script>
</body>
</html>
