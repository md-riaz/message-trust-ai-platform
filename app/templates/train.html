<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Model</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f3f4f6; display: flex; justify-content: center; min-height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin-top: 40px; height: fit-content; }
    h2 { margin-top: 0; color: #111827; }
    p { color: #4b5563; font-size: 0.95rem; margin-bottom: 20px; }
    form { display: flex; flex-direction: column; gap: 15px; }
    input[type="file"] { padding: 10px; border: 1px dashed #d1d5db; border-radius: 6px; background: #f9fafb; width: 100%; }
    button { padding: 12px; border: none; border-radius: 8px; background: #2563eb; color: white; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    .nav { margin-top: 20px; text-align: center; }
    .nav a { color: #4b5563; text-decoration: none; font-weight: 500; }
    .nav a:hover { text-decoration: underline; color: #111827; }
    code { background: #eef2ff; padding: 2px 6px; border-radius: 4px; color: #3730a3; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Upload Training Data</h2>
    <p>Upload a <code>.txt</code> file. Format:<br><code>__label__clear AcmeBank: Your OTP is 1234</code></p>
    <div style="background: #fffbeb; color: #b45309; padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; border: 1px solid #fde68a;">
      <strong>Note:</strong> Uploading a new file will completely overwrite the existing trained model. The new model will be applied instantly without needing a server restart!
    </div>
    <form action="train" enctype="multipart/form-data" method="post">
      <input name="file" type="file" accept=".txt" required>
      <button type="submit">Train Model</button>
    </form>
    <div class="nav">
      <a href="test">Go to Testing &rarr;</a><br><br>
      <a href="/message-trust-ai/">&larr; Back to Home</a>
    </div>
  </div>
</body>
</html>
