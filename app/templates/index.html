<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Trust AI</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
    h1 { margin-top: 0; color: #111827; font-size: 1.5rem; }
    p { color: #4b5563; font-size: 1rem; line-height: 1.5; margin-bottom: 24px; }
    .actions { display: flex; flex-direction: column; gap: 12px; }
    a.btn { text-decoration: none; padding: 12px 20px; border-radius: 8px; background: #2563eb; color: white; font-weight: 600; transition: background 0.2s; }
    a.btn:hover { background: #1d4ed8; }
    a.secondary { background: #4b5563; }
    a.secondary:hover { background: #374151; }
    code { background: #eef2ff; padding: 4px 8px; border-radius: 4px; color: #3730a3; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Message Trust AI</h1>
    <p>Train and test the clear-vs-unclear sender classifier from a simple text dataset.</p>
    <p style="font-size: 0.9rem;">Training format:<br><code>__label__clear AcmeBank: Your OTP is 1234</code></p>
    <div class="actions">
      <a class="btn" href="train">Open Training</a>
      <a class="btn secondary" href="test">Open Testing</a>
    </div>
  </div>
</body>
</html>
