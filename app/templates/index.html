<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Message Trust AI Platform</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background:#f7f7f7; }
    .card { max-width: 680px; margin:auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.08); }
    h1 { margin-top:0; }
    .actions { display:flex; gap:12px; margin-top:18px; }
    a.btn { text-decoration:none; padding:10px 14px; border-radius:8px; background:#111827; color:#fff; }
    a.secondary { background:#374151; }
    code { background:#eef2ff; padding:2px 6px; border-radius:4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Message Trust AI Platform</h1>
    <p>Train and test the clear-vs-unclear sender classifier from a simple text dataset.</p>
    <p>Training format per line: <code>__label__clear AcmeBank: Your OTP is 1234</code></p>

    <div class="actions">
      <a class="btn" href="train">Open Training</a>
      <a class="btn secondary" href="test">Open Testing</a>
    </div>
  </div>
</body>
</html>
